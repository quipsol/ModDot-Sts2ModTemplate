; Machine-specific settings, read on top of project.godot. Keep this file out of version control.
; The editor saves these settings here, never in project.godot. Comments are only kept at the top of this file.
; Paths: use / (or \\). A single \ is an escape character in this file and gets lost.
; Relative paths are relative to this folder.
; mounted_packs/paths: packs mounted read-only by the Godot fork: the game's pack and other mods' packs.
;   Command-line alternative: --mount-pack <file>.
; mounted_assemblies/paths: .NET assemblies loaded before the project assembly.
;   Command-line alternative: --mount-assembly <file>.
; pre_patches/paths: .NET assemblies whose module initializers run before the game starts (in the game run from the editor).
;   Command-line alternative: --pre-patch <file>.

